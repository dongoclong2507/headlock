<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEADLOCK V1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Orbitron', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #05010a;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Hiệu ứng vũ trụ ngân hà */
        .galaxy-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #2a0845 0%, #05010a 80%);
            z-index: -2;
        }
        
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: twinkle 4s infinite linear;
            z-index: -1;
            opacity: 0.3;
        }

        @keyframes twinkle {
            0% { transform: translateY(0); opacity: 0.3; }
            50% { opacity: 0.7; }
            100% { transform: translateY(-200px); opacity: 0.3; }
        }

        /* Khung ứng dụng */
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background: rgba(15, 5, 25, 0.7);
            border: 1px solid rgba(170, 0, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(170, 0, 255, 0.2), inset 0 0 20px rgba(170, 0, 255, 0.1);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        .app-container::-webkit-scrollbar { width: 0; }

        /* Tiêu đề & Trạng thái Online */
        .header-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 20px;
            width: 100%;
        }

        .header-title {
            text-align: center;
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px #aa00ff, 0 0 20px #aa00ff;
            letter-spacing: 2px;
        }

        .online-badge {
            position: absolute;
            right: 0;
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.4);
            text-shadow: 0 0 5px #00ff00;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* Các trang */
        .page { display: none; flex-direction: column; gap: 15px; animation: fadeIn 0.4s ease; width: 100%; }
        .page.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Trang Đăng Nhập */
        .login-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 50px;
            align-items: center;
            width: 100%;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #aa00ff;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            outline: none;
            text-align: center;
            box-shadow: 0 0 10px rgba(170, 0, 255, 0.3);
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #5500aa, #aa00ff);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(170, 0, 255, 0.6);
            transition: 0.2s;
        }

        .btn-primary:active { transform: scale(0.95); }

        /* Trang Chọn Game */
        .game-select {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
            width: 100%;
        }

        .game-card {
            background: rgba(30, 10, 50, 0.8);
            border: 1px solid #aa00ff;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(170, 0, 255, 0.2);
        }

        .game-card:active {
            background: rgba(80, 0, 150, 0.5);
            box-shadow: 0 0 20px #aa00ff;
        }

        .game-card h2 { color: #fff; font-size: 20px; }

        /* Trang Chức Năng (Menu) */
        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .feature-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 10, 30, 0.8);
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(170, 0, 255, 0.2);
            width: 100%;
        }

        .feature-name {
            font-size: 14px;
            font-weight: 700;
            color: #ddd;
            letter-spacing: 1px;
        }

        /* Toggle Switch (Giống ảnh) */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1a1a1a;
            transition: .4s;
            border-radius: 34px;
            border: 1px solid #333;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.8);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        input:checked + .slider {
            background-color: #aa00ff;
            border-color: #cc66ff;
            box-shadow: 0 0 10px #aa00ff, inset 0 0 5px #aa00ff;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
        }

        /* Thanh trượt tỉ lệ (Đã kéo dài) */
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
            width: 100%;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            flex: 1; 
            height: 8px;
            background: #1a1a1a;
            border-radius: 5px;
            outline: none;
            border: 1px solid #333;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #aa00ff;
            cursor: pointer;
            box-shadow: 0 0 10px #aa00ff;
        }

        .percent-display {
            color: #cc66ff;
            font-weight: bold;
            width: 45px;
            text-align: right;
            font-size: 14px;
        }

        /* Nút Kích Hoạt */
        .btn-activate {
            background: linear-gradient(45deg, #1a0033, #440088);
            border: 1px solid #aa00ff;
            color: #fff;
            padding: 15px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 12px;
            margin-top: 15px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 0 15px rgba(170, 0, 255, 0.4);
            transition: 0.2s;
            position: relative;
            overflow: hidden;
            width: 100%;
        }

        .btn-activate:active { transform: scale(0.95); }

        .btn-activate.running {
            background: #aa00ff;
            color: #fff;
            box-shadow: 0 0 30px #aa00ff;
            cursor: not-allowed;
        }

        /* Thông báo Antiban */
        .antiban-status {
            color: #00ff00;
            font-weight: bold;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            display: none;
            text-shadow: 0 0 10px #00ff00;
        }

        /* Nút Back */
        .btn-back {
            background: transparent;
            border: none;
            color: #aa00ff;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            margin-bottom: 10px;
            display: inline-block;
            align-self: flex-start;
        }

        /* Toast Thông Báo (Thay thế Alert) */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: rgba(30, 0, 50, 0.95);
            color: #fff;
            text-align: center;
            border-radius: 10px;
            padding: 16px;
            position: fixed;
            z-index: 100;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            border: 1px solid #aa00ff;
            box-shadow: 0 0 20px rgba(170, 0, 255, 0.6);
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }
    </style>
</head>
<body>

    <div class="galaxy-bg"></div>
    <div class="stars"></div>

    <div id="toast">Thông báo hệ thống</div>

    <div class="app-container">
        
        <!-- TRANG 1: ĐĂNG NHẬP -->
        <div id="page-login" class="page active">
            <div class="header-wrapper">
                <div class="header-title">HEADLOCK V1</div>
            </div>
            <div class="login-box">
                <p style="color: #aaa; font-size: 14px;">Nhập Key Để Truy Cập</p>
                <input type="text" id="key-input" placeholder="Nhập Key...">
                <button class="btn-primary" id="btn-login">XÁC NHẬN</button>
                <p id="error-msg" style="color: #ff3333; font-size: 12px; display: none; font-weight: bold;">Key không hợp lệ!</p>
            </div>
        </div>

        <!-- TRANG 2: CHỌN GAME -->
        <div id="page-game-select" class="page">
            <div class="header-wrapper">
                <div class="header-title">HEADLOCK V1</div>
                <div class="online-badge">ONLINE</div>
            </div>
            <div class="game-select">
                <div class="game-card" id="btn-ffth">
                    <h2>FREE FIRE TH</h2>
                </div>
                <div class="game-card" id="btn-ffmax">
                    <h2>FREE FIRE MAX</h2>
                </div>
            </div>
            <!-- Antiban -->
            <div class="feature-item" style="margin-top: 20px; background: rgba(50, 0, 80, 0.6); border-color: #aa00ff;">
                <span class="feature-name">ANTIBAN</span>
                <label class="switch">
                    <input type="checkbox" id="antiban-switch">
                    <span class="slider"></span>
                </label>
            </div>
            <div id="antiban-status" class="antiban-status">ANTIBAN ĐÃ BẬT</div>
        </div>

        <!-- TRANG 3: MENU CHỨC NĂNG -->
        <div id="page-menu" class="page">
            <button class="btn-back" id="btn-back">← QUAY LẠI</button>
            
            <div class="header-wrapper" style="margin-bottom: 25px;">
                <div class="header-title">HEADLOCK V1</div>
                <div class="online-badge">ONLINE</div>
            </div>
            
            <div class="feature-list">
                <div class="feature-item">
                    <span class="feature-name">AIMLOCK</span>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="feature-item">
                    <span class="feature-name">NHẸ TÂM</span>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="feature-item">
                    <span class="feature-name">FIX LỐ</span>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="feature-item">
                    <span class="feature-name">FIX RUNG</span>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="feature-item">
                    <span class="feature-name">TỐI ƯU MÁY</span>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="feature-item">
                    <span class="feature-name">AIM DRAG</span>
                    <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
            </div>

            <!-- Tỉ lệ Headshot -->
            <div class="feature-item" style="flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 10px; width: 100%;">
                <span class="feature-name">TỈ LỆ HEADSHOT</span>
                <div class="slider-container">
                    <input type="range" id="headshot-range" min="0" max="100" value="50">
                    <span class="percent-display" id="headshot-percent">50%</span>
                </div>
            </div>

            <!-- Nút Kích Hoạt -->
            <button class="btn-activate" id="activate-btn">KÍCH HOẠT</button>
        </div>

    </div>

    <script>
        // Đợi DOM load xong mới chạy script để tránh lỗi null
        document.addEventListener("DOMContentLoaded", function() {
            
            const CORRECT_KEY = "DL-XYZ-123";
            let selectedGame = "";

            // Hàm hiển thị thông báo (Toast)
            function showToast(message, isSuccess = false) {
                const toast = document.getElementById("toast");
                toast.innerText = message;
                toast.style.color = isSuccess ? "#00ff00" : "#fff";
                toast.style.borderColor = isSuccess ? "#00ff00" : "#aa00ff";
                toast.className = "show";
                setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
            }

            // 1. Xử lý Đăng Nhập
            const btnLogin = document.getElementById('btn-login');
            const keyInput = document.getElementById('key-input');
            const errorMsg = document.getElementById('error-msg');

            function checkKey() {
                const input = keyInput.value.trim();
                if (input === CORRECT_KEY) {
                    errorMsg.style.display = 'none';
                    document.getElementById('page-login').classList.remove('active');
                    document.getElementById('page-game-select').classList.add('active');
                } else {
                    errorMsg.style.display = 'block';
                    keyInput.style.borderColor = '#ff3333';
                    setTimeout(() => { keyInput.style.borderColor = '#aa00ff'; }, 500);
                }
            }

            // Gắn sự kiện click và enter cho nút đăng nhập
            btnLogin.addEventListener('click', checkKey);
            keyInput.addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    event.preventDefault();
                    checkKey();
                }
            });

            // 2. Xử lý Chọn Game
            const btnFFTH = document.getElementById('btn-ffth');
            const btnFFMAX = document.getElementById('btn-ffmax');

            function selectGame(gameName) {
                selectedGame = gameName;
                document.getElementById('page-game-select').classList.remove('active');
                document.getElementById('page-menu').classList.add('active');
            }

            btnFFTH.addEventListener('click', () => selectGame('Free Fire TH'));
            btnFFMAX.addEventListener('click', () => selectGame('Free Fire MAX'));

            // 3. Xử lý nút Quay Lại
            document.getElementById('btn-back').addEventListener('click', function() {
                document.getElementById('page-menu').classList.remove('active');
                document.getElementById('page-game-select').classList.add('active');
                
                // Reset nút kích hoạt
                const btn = document.getElementById('activate-btn');
                btn.classList.remove('running');
                btn.innerText = "KÍCH HOẠT";
                btn.disabled = false;
                btn.style.background = "linear-gradient(45deg, #1a0033, #440088)";
                btn.style.boxShadow = "0 0 15px rgba(170, 0, 255, 0.4)";
            });

            // 4. Xử lý Antiban
            document.getElementById('antiban-switch').addEventListener('change', function() {
                const statusText = document.getElementById('antiban-status');
                if (this.checked) {
                    statusText.style.display = 'block';
                    let progress = 0;
                    statusText.innerText = "ĐANG CHẠY ANTIBAN... 0%";
                    const interval = setInterval(() => {
                        progress += 10;
                        if (progress <= 100) {
                            statusText.innerText = `ĐANG CHẠY ANTIBAN... ${progress}%`;
                        } else {
                            clearInterval(interval);
                            statusText.innerText = "ANTIBAN ĐÃ BẬT";
                        }
                    }, 100);
                } else {
                    statusText.style.display = 'none';
                }
            });

            // 5. Xử lý thanh trượt Headshot
            const headshotRange = document.getElementById('headshot-range');
            headshotRange.addEventListener('input', function() {
                document.getElementById('headshot-percent').innerText = this.value + "%";
            });

            // 6. Xử lý nút Kích Hoạt
            const btnActivate = document.getElementById('activate-btn');
            
            btnActivate.addEventListener('click', function() {
                if (btnActivate.classList.contains('running')) return;

                btnActivate.classList.add('running');
                btnActivate.disabled = true;
                
                let progress = 0;
                
                const interval = setInterval(() => {
                    progress += 2;
                    if (progress <= 100) {
                        btnActivate.innerText = `ĐANG KÍCH HOẠT... ${progress}%`;
                    } else {
                        clearInterval(interval);
                        btnActivate.innerText = "ĐANG MỞ GAME...";
                        
                        setTimeout(() => {
                            btnActivate.innerText = "ĐÃ KÍCH HOẠT";
                            btnActivate.style.background = "linear-gradient(45deg, #005500, #00aa00)";
                            btnActivate.style.boxShadow = "0 0 20px #00aa00";
                            
                            // Hiện thông báo thay vì alert
                            showToast(`Đã kích hoạt thành công cho ${selectedGame}! (Headshot: ${headshotRange.value}%)`, true);
                            
                            setTimeout(() => {
                                btnActivate.classList.remove('running');
                                btnActivate.innerText = "KÍCH HOẠT LẠI";
                                btnActivate.style.background = "linear-gradient(45deg, #1a0033, #440088)";
                                btnActivate.style.boxShadow = "0 0 15px rgba(170, 0, 255, 0.4)";
                                btnActivate.disabled = false;
                            }, 2000);

                        }, 800);
                    }
                }, 25);
            });
        });
    </script>
</body>
</html>
